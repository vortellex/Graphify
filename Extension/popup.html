<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Graphify</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 820px;
      height: 620px;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 30% 0%, #171733 0%, #0b0b14 55%, #08080d 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      color: #f2f2f5;
      overflow: hidden;
    }

    #header {
      padding: 14px 20px;
      background: rgba(20, 20, 38, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 212, 255, 0.15);
    }

    #header .brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    #header h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #eafcff;
    }

    #header h1 .bolt {
      color: #00d4ff;
      filter: drop-shadow(0 0 6px rgba(0, 212, 255, 0.6));
    }

    #header .tagline {
      font-size: 11px;
      color: #7c8bb0;
      font-weight: 500;
    }

    #analyze-btn {
      background: linear-gradient(135deg, #00d4ff, #00a3c4);
      color: #061014;
      border: none;
      padding: 9px 22px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.2px;
      box-shadow: 0 2px 10px rgba(0, 212, 255, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    #analyze-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0, 212, 255, 0.5);
    }

    #analyze-btn:active {
      transform: translateY(0);
    }

    #analyze-btn:disabled {
      opacity: 0.6;
      cursor: default;
      transform: none;
    }

    #status {
      text-align: center;
      padding: 9px;
      font-size: 12.5px;
      color: #8b93ab;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid rgba(0, 212, 255, 0.25);
      border-top-color: #00d4ff;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .spinner.active {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #graph-wrap {
      position: relative;
      width: 100%;
      height: 555px;
    }

    #graph {
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #graph:active {
      cursor: grabbing;
    }

    #legend {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 15, 28, 0.78);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 11px;
      pointer-events: none;
    }

    #legend .legend-title {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #6b7490;
      margin-bottom: 6px;
      font-weight: 700;
    }

    #legend .legend-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 3px 0;
    }

    #legend .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #legend .legend-label {
      color: #c7cde0;
      text-transform: capitalize;
    }

    #hint {
      position: absolute;
      bottom: 10px;
      right: 14px;
      font-size: 10px;
      color: #5b6480;
      pointer-events: none;
    }

    #empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 6px;
      color: #4c5470;
      font-size: 13px;
      text-align: center;
      padding: 0 60px;
    }

    #empty-state .icon {
      font-size: 26px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div id="header">
    <div class="brand">
      <h1><span class="bolt">⚡</span> Graphify</h1>
      <span class="tagline">Wikipedia, mapped</span>
    </div>
    <button id="analyze-btn">Analyze Page</button>
  </div>
  <div id="status">
    <span class="spinner" id="spinner"></span>
    <span id="status-text">Open a Wikipedia page and click Analyze</span>
  </div>
  <div id="graph-wrap">
    <svg id="graph"></svg>
    <div id="legend" style="display: none;"></div>
    <div id="hint" style="display: none;">Scroll to zoom &middot; drag to pan &middot; drag a node to pin it</div>
    <div id="empty-state">
      <div class="icon">◎</div>
      <div>No graph yet — open a Wikipedia article and hit Analyze Page</div>
    </div>
  </div>

  <script src="d3.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
